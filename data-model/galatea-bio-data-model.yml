core_workflow:
  description: The primary path an integrator follows, expressed as entity transitions.
  steps:
  - upload a SourceFile (API or SFTP)
  - await source_file_validation_completed webhook, or poll data_files_list until status is valid
  - submit an ExecutionOrder naming the SourceFile and a NamedModel
  - await order_moved_to_completed_state webhook, or poll exec_orders_list with filter
  - download Results by result_type, and PdfReports by pdf_request_id
  see: skills/_index.yml
