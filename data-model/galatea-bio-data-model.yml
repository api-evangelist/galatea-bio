  the *_id reference fields that appear across payloads. Relationship confidence is stated per row.
identifiers:
  format: UUID v4
  prefixes: none
  note: >-
    Galatea Bio uses bare UUIDs with no type prefix, so an identifier is not self-describing. An
    agent must track which entity an id belongs to from context. /exec/orders accepts a single
    "filter" parameter that matches an order id, a source file id, or a source file name
    interchangeably, which is the API's own accommodation for that ambiguity.
entities:
- name: Organization
  root: true
  path: /organizations
  description: >-
    The tenant boundary. Owns users, source files, orders, credit balance, SFTP users, webhook
    subscriptions and the set of analysis models it is entitled to run.
  key_fields: [id, name, available_models, is_sandbox]
  operations: [organizations_list, organizations_create, organizations_update]
- name: User
  path: /users
  description: A member of an organization, with a role that gates admin-only endpoints.
  key_fields: [id, email, first_name, last_name, role, org_id, created_at, deleted_at]
