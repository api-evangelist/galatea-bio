problems:
- status: 400
  title: Bad Request
  meaning: Your request is invalid.
  detail_examples:
  - Bad request
  spec_occurrences: 27
  remediation: >-
    Check required body fields and query parameter types. Order submission requires a valid
    source_file_id UUID and a model_name the organization is entitled to.
- status: 401
  title: Unauthorized
  meaning: Your API key is wrong.
  detail_examples:
  - Unauthorized request
  - Authentication credentials were not provided.
  spec_occurrences: 85
  remediation: >-
    Send Authorization: Bearer <access_token>. Password-derived access tokens are short-lived -
    refresh with POST /users/refresh (users_refresh_create) before retrying.
- status: 403
  title: Forbidden
  meaning: The information requested is hidden for administrators only.
  detail_examples:
  - Forbidden
  spec_occurrences: 79
  remediation: >-
    The token is valid but the user's role does not permit the operation. Organization, credit,
    SFTP-user and model-management endpoints are admin-scoped.
- status: 404
  title: Not Found
  meaning: The specified information could not be found.
  detail_examples:
  - Not found data
  spec_occurrences: 11
  remediation: Confirm the UUID exists and belongs to the caller's organization.
- status: 405
  title: Method Not Allowed
  meaning: You tried to access an information with an invalid method.
  detail_examples:
  - 'Method "GET" not allowed.'
  spec_occurrences: 0
  documented_in: https://docs.galatea.bio/#errors-contents
  observed:
