- status: 406
  title: Not Acceptable
  meaning: You requested a format that isn't json.
  detail_examples:
  - Not acceptable request
  - Not acceptable
  - Incorrect ID
  spec_occurrences: 26
  remediation: >-
    Send Accept: application/json. Also returned for malformed identifiers - "Incorrect ID" is
    surfaced under this status rather than 400.
- status: 422
  title: Unprocessable Entity
  meaning: Your request contains incorrect data.
  detail_examples:
  - Request cannot be processed
  spec_occurrences: 5
  remediation: >-
    The request parsed but failed a business rule - for example an order against a model the
    organization is not entitled to, or a source file that has not passed validation.
- status: 500
  title: Internal Server Error
  meaning: We had a problem with our server. Try again later.
  spec_occurrences: 0
  documented_in: https://docs.galatea.bio/#errors-contents
  remediation: Retry with backoff.
- status: 503
  title: Service Unavailable
  meaning: We're temporarily offline for maintenance. Please try again later.
  spec_occurrences: 0
  documented_in: https://docs.galatea.bio/#errors-contents
  remediation: Retry with backoff.
domain_failure_states:
  note: >-
    Beyond HTTP errors, the order lifecycle carries its own terminal failure states, returned in the
    status field of an order object rather than as an HTTP error.
  order_statuses:
  - Failed
  - Canceled
  - Reports failed
  - QC failed
  result_type: EXEC_ERRORS
  result_type_note: >-
    Execution errors for a failed order are retrievable as a downloadable result of type
    EXEC_ERRORS via GET /data/results/{exec_order_id}/download.
client_handling:
  library: https://github.com/GalateaBio/octopod-cli
  exception: OctopodApiException
  note: >-
    The first-party client treats any status outside 200-299 as an error, reads the "detail" member
    when present, and otherwise raises with the raw response text plus the status code.
