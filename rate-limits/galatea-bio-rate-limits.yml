  published: false
  note: >-
    The docs advise retrying later on 500 and 503, but give no backoff policy, no retry budget and
    no rate ceiling.
adjacent_quota_controls:
  note: >-
    Throughput is governed commercially rather than by request rate. Two real constraints are
    published and are the closest thing to a documented limit.
  constraints:
  - kind: request-body size
    value: 50 MB
    scope: POST /data/files/upload
    source: https://docs.galatea.bio/#recipe-upload-file-get-status
    note: Files above this must be delivered over SFTP; the docs call SFTP the preferred path.
  - kind: consumption quota
    value: per-organization credit balance
    scope: order submission
    source: openapi/galatea-bio-octopod-openapi.yml
    note: >-
      Orders draw down a credit balance (see plans/galatea-bio-plans-pricing.yml). Exhausting
      credits, not exceeding a request rate, is the practical limit on this API.
  - kind: pagination ceiling
    value: page_size query parameter, client default 10
    scope: all collection endpoints
    note: No maximum page_size is documented.
  - kind: webhook retries
    value: max_retries_count, configured per subscription
    scope: outbound webhook delivery
    source: https://docs.galatea.bio/#recipe-handling-webhooks-deliveries
