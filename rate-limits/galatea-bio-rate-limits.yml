note: >-
  Galatea Bio publishes no rate limits for the Octopod Ancestry API. The GalateaBio Ancestry API
  documentation has no rate-limit section; its Errors table lists 400, 401, 403, 404, 405, 406, 422,
  500 and 503 and does not include 429. No 429 response is declared on any of the 99 operations in
  the published Swagger document, and no RateLimit-*, X-RateLimit-* or Retry-After header appears in
  the spec or the docs. An honest zero.
