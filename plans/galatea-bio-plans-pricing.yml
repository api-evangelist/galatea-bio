note: >-
  Galatea Bio publishes no pricing page and no plan tiers. The marketing site is a single-page React
  app whose bundle contains exactly three routes - /about-us, /investor-relations and /life-sciences
  - plus the news, events and publications pages listed in its sitemap. There is no /pricing route,
  and the site returns HTTP 200 with the app shell for any path, so a bare 200 on /pricing is a
  soft-404 and was not treated as a hit. The GalateaBio Ancestry API documentation covers
  authentication, endpoints and recipes but never mentions price, quota, or tier. Access to the
  Octopod Ancestry API is provisioned per organization by Galatea Bio.
