aid: galatea-bio
name: Galatea Bio
description: >-
  Galatea Bio is a Miami Lakes, Florida genomics company that operates a CLIA-CMS certified,
  CAP-accredited high-complexity clinical laboratory alongside the Biobank of the Americas, working to
  close the ancestry gap in genomic medicine by sequencing populations under-represented in existing
  reference panels. Its developer surface is the Octopod Ancestry API, a REST API at
  https://api.galatea.bio/api/v1 that lets clinical and research customers upload genomic source files
  (VCF) over HTTPS or SFTP, submit execution orders against named analysis models including the
  StrataRisk polygenic risk score, organize work with tags, receive HMAC-signed webhook deliveries when
  a file validates or an order completes, and download ancestry, PRS, JSON and PDF report results. The
  same API also exposes organization administration, SFTP user and SSH key management, credit/tariff
  accounting, dashboards and statistics.
