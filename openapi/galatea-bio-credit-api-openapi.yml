  /credit/tariff:
    parameters: []
    get:
      operationId: credit_tariff_list
      description: Get credit tariffs
      parameters:
      - name: page
        in: query
        description: A page number within the paginated result set.
        required: false
        schema:
          type: integer
      - name: page_size
        in: query
        description: Number of results to return per page.
        required: false
        schema:
          type: integer
      - name: orgs_ids
        in: query
        description: Ids of organizations
        required: false
        schema:
          type: array
