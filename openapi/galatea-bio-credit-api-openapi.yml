            - hutt
            - palpatine
            - vader
            - mysterio
      responses:
        '401':
          description: unauthorized
        '403':
          description: forbidden
        '200':
          description: Credit services list
          content:
            application/json:
              schema:
                required:
                - count
                - results
                type: object
                properties:
                  count:
                    type: integer
                  next:
                    type:
                    - string
                    - 'null'
                    format: uri
                  previous:
                    type:
                    - string
                    - 'null'
                    format: uri
                  results:
                    type: array
                    items:
                      required:
                      - type
                      type: object
                      properties:
                        id:
                          title: Id
                          type: string
                          format: uuid
                          readOnly: true
                        name:
                          title: Name
                          type: string
                          readOnly: true
                        type:
                          title: Type
                          type: string
                          enum:
                          - EXECUTE_MODEL_WGS
                          - EXECUTE_MODEL_GNT
                          - REPLENISHMENT
                          - GENERATE_PDF_REPORT_ANCESTRY
                          - GENERATE_PDF_REPORT_PRS_RUO_CARDIO
                          - GENERATE_PDF_REPORT_PRS_RUO_CANCER
                          - GENERATE_PDF_REPORT_PRS_CLINICAL
                          - GENERATE_PDF_REPORT_PRS_CLINICAL_CARDIO
                          - GENERATE_PDF_REPORT_PRS_CLINICAL_CANCER
                        named_model:
                          required:
                          - id
                          - model_name
                          type:
                          - object
                          - 'null'
                          properties:
                            id:
                              title: Id
                              type: string
                              format: uuid
                            model_name:
                              title: Model name
                              type: string
                              minLength: 1
                        created_at:
                          title: Created at
                          type: string
                          format: date-time
                          readOnly: true
      tags:
      - credit
    post:
      operationId: credit_service_create
      description: Create credit service
      responses:
        '400':
          description: Bad request
        '401':
          description: Unauthorized request
        '403':
          description: Forbidden
        '406':
          description: Not acceptable
        '201':
          description: New credit service
          content:
            application/json:
              schema:
                required:
                - type
                type: object
                properties:
                  id:
                    title: Id
                    type: string
                    format: uuid
                    readOnly: true
                  name:
                    title: Name
                    type: string
                    readOnly: true
                  type:
                    title: Type
                    type: string
                    enum:
                    - EXECUTE_MODEL_WGS
                    - EXECUTE_MODEL_GNT
                    - REPLENISHMENT
                    - GENERATE_PDF_REPORT_ANCESTRY
                    - GENERATE_PDF_REPORT_PRS_RUO_CARDIO
                    - GENERATE_PDF_REPORT_PRS_RUO_CANCER
                    - GENERATE_PDF_REPORT_PRS_CLINICAL
                    - GENERATE_PDF_REPORT_PRS_CLINICAL_CARDIO
                    - GENERATE_PDF_REPORT_PRS_CLINICAL_CANCER
                  named_model:
                    required:
                    - id
                    - model_name
                    type:
                    - object
                    - 'null'
                    properties:
                      id:
                        title: Id
                        type: string
                        format: uuid
                      model_name:
                        title: Model name
                        type: string
                        minLength: 1
                  created_at:
                    title: Created at
                    type: string
                    format: date-time
                    readOnly: true
      tags:
      - credit
      requestBody:
        content:
          application/json:
            schema:
              required:
              - type
              type: object
              properties:
                named_model_id:
                  title: Named model id
                  type:
                  - string
                  - 'null'
                  format: uuid
                type:
                  title: Type
                  type: string
                  enum:
                  - EXECUTE_MODEL_WGS
                  - EXECUTE_MODEL_GNT
                  - REPLENISHMENT
                  - GENERATE_PDF_REPORT_ANCESTRY
                  - GENERATE_PDF_REPORT_PRS_RUO_CARDIO
                  - GENERATE_PDF_REPORT_PRS_RUO_CANCER
                  - GENERATE_PDF_REPORT_PRS_CLINICAL
                  - GENERATE_PDF_REPORT_PRS_CLINICAL_CARDIO
                  - GENERATE_PDF_REPORT_PRS_CLINICAL_CANCER
        required: true
  /credit/service/{credit_service_id}:
    parameters:
    - name: credit_service_id
      in: path
