  /credit/tariff:
    get:
      operationId: credit_tariff_list
      description: Get credit tariffs
      parameters:
      - name: page
        in: query
        description: A page number within the paginated result set.
        required: false
        type: integer
      - name: page_size
        in: query
        description: Number of results to return per page.
        required: false
        type: integer
      - name: orgs_ids
        in: query
        description: Ids of organizations
        required: false
        type: array
        items:
          type: string
      - name: credit_service_types
        in: query
        description: Search by credit service type
        required: false
        type: array
        items:
          type: string
          enum:
          - EXECUTE_MODEL_WGS
          - EXECUTE_MODEL_GNT
          - REPLENISHMENT
          - GENERATE_PDF_REPORT_ANCESTRY
          - GENERATE_PDF_REPORT_PRS_RUO_CARDIO
          - GENERATE_PDF_REPORT_PRS_RUO_CANCER
          - GENERATE_PDF_REPORT_PRS_CLINICAL
          - GENERATE_PDF_REPORT_PRS_CLINICAL_CARDIO
          - GENERATE_PDF_REPORT_PRS_CLINICAL_CANCER
      - name: model_api_names
        in: query
        description: Search by model api name
        required: false
        type: array
        items:
          type: string
          enum:
          - skywalker
          - hutt
          - palpatine
          - vader
          - mysterio
      - name: named_models
        in: query
        description: Search by named models
        required: false
        type: array
        items:
          type: string
      responses:
        '401':
          description: unauthorized
        '403':
          description: forbidden
        '200':
          description: Credit tariffs list
