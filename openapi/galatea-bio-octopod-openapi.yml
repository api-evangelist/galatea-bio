          description: forbidden
        '200':
          description: Credit services list
          schema:
            required:
            - count
            - results
            type: object
            properties:
              count:
                type: integer
              next:
                type: string
                format: uri
                x-nullable: true
              previous:
                type: string
                format: uri
                x-nullable: true
              results:
                type: array
                items:
                  required:
                  - type
                  type: object
                  properties:
                    id:
                      title: Id
                      type: string
                      format: uuid
                      readOnly: true
                    name:
                      title: Name
                      type: string
                      readOnly: true
                    type:
                      title: Type
                      type: string
                      enum:
                      - EXECUTE_MODEL_WGS
                      - EXECUTE_MODEL_GNT
                      - REPLENISHMENT
                      - GENERATE_PDF_REPORT_ANCESTRY
                      - GENERATE_PDF_REPORT_PRS_RUO_CARDIO
                      - GENERATE_PDF_REPORT_PRS_RUO_CANCER
                      - GENERATE_PDF_REPORT_PRS_CLINICAL
                      - GENERATE_PDF_REPORT_PRS_CLINICAL_CARDIO
                      - GENERATE_PDF_REPORT_PRS_CLINICAL_CANCER
                    named_model:
                      required:
                      - id
                      - model_name
                      type: object
                      properties:
                        id:
                          title: Id
                          type: string
                          format: uuid
                        model_name:
                          title: Model name
                          type: string
                          minLength: 1
                      x-nullable: true
                    created_at:
                      title: Created at
                      type: string
                      format: date-time
                      readOnly: true
      tags:
      - credit
    post:
      operationId: credit_service_create
      description: Create credit service
      parameters:
      - name: data
        in: body
        required: true
        schema:
          required:
          - type
          type: object
          properties:
            named_model_id:
              title: Named model id
              type: string
              format: uuid
              x-nullable: true
            type:
              title: Type
              type: string
              enum:
              - EXECUTE_MODEL_WGS
              - EXECUTE_MODEL_GNT
              - REPLENISHMENT
              - GENERATE_PDF_REPORT_ANCESTRY
              - GENERATE_PDF_REPORT_PRS_RUO_CARDIO
              - GENERATE_PDF_REPORT_PRS_RUO_CANCER
              - GENERATE_PDF_REPORT_PRS_CLINICAL
              - GENERATE_PDF_REPORT_PRS_CLINICAL_CARDIO
              - GENERATE_PDF_REPORT_PRS_CLINICAL_CANCER
      responses:
        '400':
          description: Bad request
        '401':
          description: Unauthorized request
        '403':
          description: Forbidden
        '406':
          description: Not acceptable
        '201':
          description: New credit service
          schema:
            required:
            - type
            type: object
            properties:
              id:
                title: Id
                type: string
                format: uuid
                readOnly: true
              name:
                title: Name
                type: string
                readOnly: true
              type:
                title: Type
                type: string
                enum:
                - EXECUTE_MODEL_WGS
                - EXECUTE_MODEL_GNT
                - REPLENISHMENT
                - GENERATE_PDF_REPORT_ANCESTRY
                - GENERATE_PDF_REPORT_PRS_RUO_CARDIO
                - GENERATE_PDF_REPORT_PRS_RUO_CANCER
                - GENERATE_PDF_REPORT_PRS_CLINICAL
                - GENERATE_PDF_REPORT_PRS_CLINICAL_CARDIO
                - GENERATE_PDF_REPORT_PRS_CLINICAL_CANCER
              named_model:
                required:
                - id
                - model_name
                type: object
                properties:
                  id:
                    title: Id
                    type: string
                    format: uuid
                  model_name:
                    title: Model name
                    type: string
                    minLength: 1
                x-nullable: true
              created_at:
                title: Created at
                type: string
                format: date-time
                readOnly: true
