openapi: 3.2.0
info:
  title: Octopod Dashboard API
  version: v1
servers:
- url: https://api.galatea.bio/api/v1
security:
- Bearer: []
tags:
- name: dashboard
paths:
  /dashboard/admix:
    parameters: []
    get:
      operationId: dashboard_admix_list
      description: Get dashboard data AdmixPlot
      parameters:
      - name: sort_by
        in: query
        description: Sorting
        required: false
        schema:
          type: string
          enum:
          - sp_group
      - name: group_by
        in: query
        description: Grouping
        required: false
        schema:
          type: string
          enum:
          - sp_group
      - name: order_id
        in: query
        description: Search by order id
        required: false
        schema:
          type: string
      - name: tags_ids
        in: query
        description: Filter by tags ids
        required: false
        schema:
          type: array
          items:
            type: string
      - name: ancestral_component
        in: query
        description: 'Ancestral component, one of item related to the model api

          Skywalker: AFR, AMR, EAS, EUR, LME, OCE, SAS

          Vader: AFR, AMR, EAS, EUR, LME, SAS, SEA, OCE, OTHERSHutt: AFR, EUR, EAS, NAM, SAS, OCE, LMEPalpatine: CAS, EAS, NAS, SAS, SEA, WAS, XAS'
        required: false
        schema:
          type: string
      - name: threshold
        in: query
        description: Threshold
        required: false
        schema:
          type: number
      - name: model_name
        in: query
        description: Model name
        required: false
        schema:
          type: string
      - name: model_api_name
        in: query
        description: Model API name
        required: false
        schema:
          type: string
          enum:
          - skywalker
          - hutt
          - palpatine
          - vader
          - mysterio
      - name: min_date
        in: query
        description: Min date
        required: false
        example: '2000-01-01'
        schema:
          type: string
          format: date
          pattern: YYYY-MM-DD
      - name: max_date
        in: query
        description: Max date
        required: false
        example: '2000-01-01'
        schema:
          type: string
          format: date
          pattern: YYYY-MM-DD
      - name: all_records
        in: query
        description: Show all records
        required: false
        schema:
          type: boolean
      - name: plot_request_id
        in: query
        description: Get already existed backend plot
        required: false
        schema:
          type: string
      responses:
        '401':
          description: unauthorized
        '403':
          description: forbidden
        '200':
          description: Entity list
          content:
            application/json:
              schema:
                required:
                - meta
                - items
                type: object
                properties:
                  meta:
                    required:
                    - groups
                    - total_count
                    type: object
                    properties:
                      groups:
                        type: array
                        items:
                          required:
                          - name
                          - count
                          type: object
                          properties:
                            name:
                              title: Name
                              type: string
                              minLength: 1
                            count:
                              title: Count
                              type: integer
                      total_count:
                        title: Total count
                        type: integer
                  items:
                    type: array
                    items:
                      required:
                      - x
                      - y
                      - series
                      type: object
                      properties:
                        x:
                          title: X
                          type: string
                          minLength: 1
                        y:
                          title: Y
                          type: number
                        series:
                          title: Series
                          type: string
                          minLength: 1
      tags:
      - dashboard
