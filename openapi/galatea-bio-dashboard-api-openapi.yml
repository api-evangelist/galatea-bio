  /dashboard/plot_request:
    parameters: []
    get:
      operationId: dashboard_plot_request_list
      description: Get plot requests
      parameters:
      - name: page
        in: query
        description: A page number within the paginated result set.
        required: false
        schema:
          type: integer
      - name: page_size
        in: query
        description: Number of results to return per page.
        required: false
        schema:
          type: integer
      - name: model_api_name
        in: query
        description: Model API name
        required: false
        schema:
          type: string
          enum:
          - skywalker
          - hutt
          - palpatine
          - vader
          - mysterio
      responses:
        '401':
          description: unauthorized
        '403':
          description: forbidden
        '200':
          description: Plot requests list
          content:
            application/json:
              schema:
                required:
                - count
                - results
                type: object
                properties:
                  count:
                    type: integer
                  next:
                    type:
                    - string
                    - 'null'
                    format: uri
                  previous:
                    type:
                    - string
                    - 'null'
                    format: uri
                  results:
                    type: array
                    items:
                      required:
                      - filter
                      - model_api_name
                      type: object
                      properties:
                        id:
                          title: Id
                          type: string
                          format: uuid
                          readOnly: true
                        user_id:
                          title: User id
                          type: string
                          readOnly: true
                        filter:
                          title: Filter
                          type: string
                        model_api_name:
                          title: Model api name
                          type: string
                          enum:
                          - skywalker
                          - hutt
                          - palpatine
                          - vader
                          - mysterio
                          - check_source
                        items_count:
                          title: Items count
                          type:
                          - integer
                          - 'null'
                          maximum: 2147483647
                          minimum: -2147483648
                        created_at:
                          title: Created at
                          type: string
                          format: date-time
                          readOnly: true
                        updated_at:
                          title: Updated at
                          type: string
                          format: date-time
                          readOnly: true
                        completed:
                          title: Completed
                          type: string
                          readOnly: true
