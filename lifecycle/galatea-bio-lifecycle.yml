  deprecated_operations: []
  note: >-
    No operation in the spec carries deprecated: true. Deprecation exists at the ANALYSIS MODEL
    layer instead of the API layer - models can be marked deprecated and filtered out.
  model_level_deprecation:
    field: deprecated
    schema_location: organization model objects
    filter_parameter: hide_deprecated
    filter_default: true
    operation_id: organizations_models_list
    path: GET /organizations/{organization_id}/models
    description: >-
      Callers can enumerate an organization's models and exclude deprecated ones. This is the only
      deprecation signal the platform exposes, and it governs which analysis models an order may be
      submitted against, not which endpoints remain callable.
  model_history:
    operation_id: exec_named_model_history_list
    path: GET /exec/named_model/{named_model_id}/history
    description: >-
      Named models carry a version history, so the pinned artifact behind an order is traceable over
      time even though the API surface itself is unversioned beyond v1.
